name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushes the static export to Byte-Magazine/Byte-Magazine.github.io (org Pages /
# byte-mag.ir). That repo publishes whatever is on its `main` branch.
permissions:
  contents: read

concurrency:
  group: deploy-github-io
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Root deploy (github.io / byte-mag.ir) — do NOT set NEXT_PUBLIC_BASE_PATH.
      - run: pnpm build
        env:
          NEXT_PUBLIC_PDF_BASE_URL: ${{ vars.NEXT_PUBLIC_PDF_BASE_URL }}

      # GitHub Pages runs Jekyll by default; `_next/` would be ignored without this.
      - run: touch out/.nojekyll

      - name: Publish to Byte-Magazine.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: Byte-Magazine/Byte-Magazine.github.io
          publish_branch: main
          publish_dir: ./out
          # Single deploy commit; the github.io repo is an artifact, not history.
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: byte-new-website@${{ github.sha }}"
