name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 1) Build and force-push static export to Byte-Magazine.github.io
# 2) SSH to production: pull that repo and restart nginx
permissions:
  contents: read

concurrency:
  group: deploy-github-io
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Root deploy (github.io / byte-mag.ir) — do NOT set NEXT_PUBLIC_BASE_PATH.
      - run: pnpm build
        env:
          NEXT_PUBLIC_PDF_BASE_URL: ${{ vars.NEXT_PUBLIC_PDF_BASE_URL }}

      # GitHub Pages runs Jekyll by default; `_next/` would be ignored without this.
      - run: touch out/.nojekyll

      - name: Publish to Byte-Magazine.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: Byte-Magazine/Byte-Magazine.github.io
          publish_branch: main
          publish_dir: ./out
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: byte-new-website@${{ github.sha }}"

  production:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Pull on server and restart nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PROD_DEPLOY_PATH }}"
            git pull --ff-only origin main
            sudo systemctl restart nginx
